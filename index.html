<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JouleLab - Sistema de Links</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #0a2540 0%, #1a3a5f 100%);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            max-width: 900px;
            width: 100%;
            text-align: center;
        }
        
        header {
            margin-bottom: 40px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        
        .logo-img {
            width: 45px;
            height: 45px;
            margin-right: 15px;
            border-radius: 8px;
        }
        
        h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            background: linear-gradient(to right, #FFD700, #FFA500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        .subtitle {
            font-size: 1.2rem;
            color: #a8d2ff;
            margin-bottom: 40px;
        }
        
        .page {
            display: none;
        }
        
        .page.active {
            display: block;
        }
        
        .buttons-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
            margin-bottom: 50px;
        }
        
        .btn {
            background: linear-gradient(135deg, #1e4a76 0%, #2a5c8f 100%);
            border: none;
            border-radius: 15px;
            padding: 25px 20px;
            color: white;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
        }
        
        .btn:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 25px rgba(0, 0, 0, 0.3);
            background: linear-gradient(135deg, #2a5c8f 0%, #3a7cc4 100%);
        }

        .btn-nav {
            background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
            color: #0a2540;
        }

        .btn-nav .btn-text {
            color: #0a2540;
            font-weight: bold;
        }
        
        .btn-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            color: #FFD700;
        }

        .btn-nav .btn-icon {
            color: #0a2540;
        }
        
        .btn-text {
            margin-top: 10px;
            font-size: 0.9rem;
            color: #cce0ff;
            opacity: 0.9;
        }
        
        footer {
            margin-top: 30px;
            padding: 20px;
            text-align: center;
            color: #a8d2ff;
            font-size: 1.1rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
        }
        
        .footer-text {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        
        .solar-icon {
            color: #FFD700;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">
                <img src="Imagens/ÍCONE Joule.png" class="logo-img">
                <h1>JouleLab Energia Solar</h1>
            </div>
            <p id="main-subtitle" class="subtitle">Sistema de links para facilitar seu trabalho</p>
        </header>
        
        <main>

            <!-- PAGE 1 -->
            <div id="page1" class="page active">
                <div class="buttons-container">
                    
                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Dimensionamento-solar/')">
                        <div class="btn-icon">📊</div>
                        Dimensionamento Solar
                        <div class="btn-text">Calcule a potência necessária</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Procura-o/')">
                        <div class="btn-icon">📝</div>
                        Gerador de Procuração
                        <div class="btn-text">Crie procurações para clientes</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Calculadora-de-Aumento-de-Carga-El-trica/')">
                        <div class="btn-icon">⚡</div>
                        Aumento de Carga
                        <div class="btn-text">Calcule aumentos na carga elétrica</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Calculadora-de-Rateio-de-Energia-Solar/')">
                        <div class="btn-icon">🔋</div>
                        Rateio de Energia
                        <div class="btn-text">Calcule o rateio entre unidades</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Emissor-de-Proposta---Sistema-Fotovoltaico/')">
                        <div class="btn-icon">📋</div>
                        Emissor de Proposta
                        <div class="btn-text">Proposta na sua mão</div>
                    </button>

                    <button class="btn btn-nav" onclick="changePage('page2', 'Documentação e Registros')">
                        <div class="btn-icon">➡️</div>
                        Mais Ferramentas
                        <div class="btn-text">Acesse a segunda página</div>
                    </button>

                </div>
            </div>

            <!-- PAGE 2 -->
            <div id="page2" class="page">
                <div class="buttons-container">

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Controle-de-portal/')">
                        <div class="btn-icon">💡</div>
                        Painel de Controle Joule
                        <div class="btn-text">Gestão interna Joule</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Registro-Inmetro-Joule/')">
                        <div class="btn-icon">📜</div>
                        Registro Inmetro Joule
                        <div class="btn-text">Consulte registros oficiais</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Emissor-de-contrato/')">
                        <div class="btn-icon">⚡</div>
                        Emissor de contrato
                        <div class="btn-text">Contrato</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/CONTRATO-DE-LOCA-O-DE-IM-VEL/')">
                        <div class="btn-icon">🏢</div>
                        Emissor de contrato locação de imóveis
                        <div class="btn-text">Contrato</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Calculadora-Fio-B-/')">
                        <div class="btn-icon">📈</div>
                        Calculadora Fio B
                        <div class="btn-text">Calculadora</div>
                    </button>

                    <!-- NOVO BOTÃO -->
                    <button class="btn btn-nav" onclick="changePage('page3', 'Ferramentas Extras')">
                        <div class="btn-icon">➡️</div>
                        Mais Links
                        <div class="btn-text">Acesse a terceira página</div>
                    </button>

                    <button class="btn btn-nav" onclick="changePage('page1', 'Sistema de links para facilitar seu trabalho')">
                        <div class="btn-icon">⬅️</div>
                        Voltar
                        <div class="btn-text">Página anterior</div>
                    </button>

                </div>
            </div>

            <!-- PAGE 3 -->
            <div id="page3" class="page">
                <div class="buttons-container">

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/SolarCalc/')">
                        <div class="btn-icon">☀️</div>
                        SolarCalc
                        <div class="btn-text">Calculadora solar avançada</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/Separador-de-PDF/')">
                        <div class="btn-icon">📄</div>
                        Separador de PDF
                        <div class="btn-text">Separe arquivos PDF facilmente</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/SolarDim/')">
                        <div class="btn-icon">⚡</div>
                        SolarDim
                        <div class="btn-text">Dimensionamento Fotovoltaico Profissional</div>
                    </button>

                    <button class="btn" onclick="openLink('https://jouleengenharia0-ctrl.github.io/RemovAss/')">
                        <div class="btn-icon">🤖</div>
                        Processador de Assinaturas
                        <div class="btn-text">Remova o fundo e melhore assinaturas </div>
                    </button>

                    <button class="btn btn-nav" onclick="changePage('page2', 'Documentação e Registros')">
                        <div class="btn-icon">⬅️</div>
                        Voltar
                        <div class="btn-text">Página anterior</div>
                    </button>

                </div>
            </div>

        </main>

        <footer>
            <div class="footer-text">
                <span>JouleLab Energia Solar</span>
                <span class="solar-icon">⚡</span>
            </div>
        </footer>
    </div>

    <script>
        function openLink(url) {
            window.open(url, '_blank');
        }

        function changePage(pageId, subtitleText) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
            document.getElementById('main-subtitle').innerText = subtitleText;
            window.scrollTo(0, 0);
        }
    </script>
</body>
</html>
